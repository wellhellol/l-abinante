<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peach swatches</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" />
  <style>
    body {
      margin: 0;
      padding: 2rem 1.5rem;
      background: #ffffff;
      color: #232323;
      font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif;
      font-size: 1.125rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 1.5rem;
    }

    .swatch {
      height: 8rem;
    }

    h2 {
      margin: 0.75rem 0 0.25rem;
      font-size: 1.2rem;
    }

    p {
      margin: 0 0 0.5rem;
    }

    .hl {
      padding: 0.05em 0.3em;
      font-weight: 700;
    }

    .orange {
      color: #6e6a65;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="swatch" style="background:#ffb59a"></div>
      <h2>F1 #ffb59a</h2>
      <p><span class="hl" style="background:#ffb59a">How I can help</span></p>
    </div>
    <div>
      <div class="swatch" style="background:#ffa58f"></div>
      <h2>F2 #ffa58f</h2>
      <p><span class="hl" style="background:#ffa58f">How I can help</span></p>
    </div>
    <div>
      <div class="swatch" style="background:#ffad94"></div>
      <h2>F3 #ffad94</h2>
      <p><span class="hl" style="background:#ffad94">How I can help</span></p>
    </div>
    <div>
      <div class="swatch" style="background:#ffbe98"></div>
      <h2>F4 #ffbe98</h2>
      <p><span class="hl" style="background:#ffbe98">How I can help</span></p>
    </div>
    <div>
      <div class="swatch" style="background:#ff9e87"></div>
      <h2>F5 #ff9e87</h2>
      <p><span class="hl" style="background:#ff9e87">How I can help</span></p>
    </div>
    <div>
      <div class="swatch" style="background:#ff9966"></div>
      <h2>For comparison: #ff9966</h2>
      <p class="orange">What I've been using. This is orange.</p>
    </div>
  </div>
</body>
</html>
